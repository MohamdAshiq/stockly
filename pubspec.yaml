name: stockly
description: "A simple stock watchlist app to track your favorite stocks and stay updated on market movements"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.0
  flutter_dotenv: ^6.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  skeletonizer: ^2.1.3
  equatable: ^2.1.0
  rxdart: ^0.28.0
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0

# Dev Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - .env
